<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analize</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14181f;--muted:#5b6472;--line:#dfe3e8;--accent:#1f5eff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#191e25;--text:#f1f3f6;--muted:#9aa4b2;--line:#2a313b;--accent:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:800px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;line-height:32px;margin:0 0 24px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:24px;color:inherit;text-decoration:none}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.card strong{display:block;font-size:16px;line-height:24px;margin-bottom:8px;color:var(--accent)}
a.card span{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>Analize</h1>
<a class="card" href="pariuri.html"><strong>Analiză pariuri</strong><span>Sugestii din clasamente, goluri și formă pentru fotbal, tenis, baschet, hochei, fotbal american și baseball.</span></a>
</div>
</body>
</html>
